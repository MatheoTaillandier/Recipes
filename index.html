<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipes</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="hero">
    <div class="hero-content">
      <h1>Recipes</h1>
      <div class="filters">

        <div class="filter-row">
          <div class="filter-group" id="seasonFilter">
            <span class="filter-tag" data-tag="spring">🌿 Spring</span>
            <span class="filter-tag" data-tag="summer">☀️ Summer</span>
            <span class="filter-tag" data-tag="autumn">🍂 Autumn</span>
            <span class="filter-tag" data-tag="winter">❄️ Winter</span>
          </div>
        </div>

        <div class="filter-row ingredient-search-row">
          <div class="ingredient-search-wrapper">
            <input
              type="text"
              id="ingredientInput"
              class="ingredient-input"
              placeholder="Add an ingredient…"
              autocomplete="off"
            />
            <button id="ingredientAddBtn" class="ingredient-add-btn">+</button>
          </div>
          <div id="ingredientTags" class="ingredient-tags"></div>
        </div>

      </div>
    </div>
  </header>

  <section id="recipes" class="recipes-section">
    <div class="recipes-grid" id="recipesGrid">
      <!-- Cards injected by JS -->
    </div>
  </section>

  <footer>
    <p>© 2026 Mathéo Taillandier</p>
  </footer>

  <div id="modal-container"></div>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
