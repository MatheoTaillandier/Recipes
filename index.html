<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipes</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">Recipes</div>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-content">
      <div class="filters">

        <div class="filter-row">
          <div class="filter-group" id="seasonFilter">
            <span class="filter-tag" data-tag="spring">🌿 Spring</span>
            <span class="filter-tag" data-tag="summer">☀️ Summer</span>
            <span class="filter-tag" data-tag="autumn">🍂 Autumn</span>
            <span class="filter-tag" data-tag="winter">❄️ Winter</span>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Projects Section -->
  <section id="recipes" class="recipes-section">
    <div class="recipes-grid" id="recipesGrid">
      <!-- Cards injected by JS -->
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Mathéo Taillandier</p>
  </footer>

  <div id="modal-container"></div>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
